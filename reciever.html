<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Processing Payload...</title>
</head>

<body>
    <p>Loading payload...</p>

    <script>
        // Run immediately as the script is parsed
        (function () {
            // Grab the query string from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const b64Param = urlParams.get('b64');

            if (b64Param) {
                // Define the expected prefix from your QR code link
                const prefix = 'data/text,format=base64,';
                let b64String = '';

                // Extract the actual Base64 code
                if (b64Param.startsWith(prefix)) {
                    b64String = b64Param.substring(prefix.length);
                } else {
                    // Fallback: if the prefix is slightly different, grab everything after the last comma
                    const parts = b64Param.split(',');
                    b64String = parts[parts.length - 1];
                }

                try {
                    // Decode the Base64 string
                    const decodedHTML = atob(b64String);

                    // Overwrite the current document
                    document.open();
                    document.write(decodedHTML);
                    document.close();
                } catch (error) {
                    document.body.innerHTML = '<p style="color: red;">Error: Failed to decode the payload. Ensure the QR code contains valid Base64.</p>';
                    console.error("Decoding error:", error);
                }
            } else {
                document.body.innerHTML = '<p>No payload detected in the URL parameters.</p>';
            }
        })();
    </script>
</body>

</html>
