<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Base64 Page Rewriter</title>
            <style>
                    body {
                                font-family: sans-serif;
                                            max-width: 600px;
                                                        margin: 2rem auto;
                                                                    padding: 1rem;
                                                                                background: #f4f4f4;
                                                                                        }
                                                                                                textarea {
                                                                                                            width: 100%;
                                                                                                                        height: 150px;
                                                                                                                                    margin-bottom: 1rem;
                                                                                                                                                font-family: monospace;
                                                                                                                                                            padding: 0.5rem;
                                                                                                                                                                        box-sizing: border-box;
                                                                                                                                                                                }
                                                                                                                                                                                        button {
                                                                                                                                                                                                    padding: 0.5rem 1rem;
                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                            background: #007bff;
                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                border-radius: 3px;
                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                button:hover {
                                                                                                                                                                                                                                                                                            background: #0056b3;
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                        <body>
                                                                                                                                                                                                                                                                                                            <h2>Base64 to HTML Decoder</h2>
                                                                                                                                                                                                                                                                                                                <p>Paste your Base64 encoded code below. Clicking the button will completely overwrite this page with the decoded content.</p>
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                        <textarea id="base64Input" placeholder="e.g., PGgxPkhlbGxvIFdvcmxkPC9oMT4="></textarea>
                                                                                                                                                                                                                                                                                                                            <br>
                                                                                                                                                                                                                                                                                                                                <button onclick="rewritePage()">Decode and Rewrite</button>

                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                            function rewritePage() {
                                                                                                                                                                                                                                                                                                                                                        const input = document.getElementById('base64Input').value.trim();
                                                                                                                                                                                                                                                                                                                                                                    if (!input) {
                                                                                                                                                                                                                                                                                                                                                                                    alert("Please enter some Base64 code first.");
                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                                                                            // Decode the Base64 string into standard text
                                                                                                                                                                                                                                                                                                                                                                                                                                                            const decodedHTML = atob(input);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // document.open() clears the current DOM
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.open();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // document.write() injects the new HTML
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.write(decodedHTML);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // document.close() tells the browser we have finished writing
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.close();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Failed to decode. Please ensure the string is valid Base64.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
